name: Build & Release Tasks

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Tasks.sln

    - name: Build solution
      run: dotnet build Tasks.sln -c Release --no-restore

    - name: Run unit tests
      run: dotnet test TasksApp.Tests/TasksApp.Tests.csproj -c Release --no-build --verbosity normal

    - name: Publish Standalone Single-File Executable
      run: >
        dotnet publish TasksApp/TasksApp.csproj
        -c Release
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:EnableCompressionInSingleFile=true
        -p:DebugType=none
        -p:DebugSymbols=false
        -o publish/

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tasks-win-x64
        path: publish/Tasks.exe

    - name: Create GitHub Release on Tag
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: publish/Tasks.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
